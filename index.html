<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BHCRMS - Login</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="brand"><div class="logo">❤</div><h1>BHCRMS</h1><p>Barangay Ibaba Health Center</p></div>
  <form id="loginForm">
    <label>Email / Username</label><input id="loginUser" required placeholder="Enter username">
    <label>Password</label><input id="loginPass" type="password" required placeholder="Enter password">
    <label>Login as</label><select id="loginRole"><option value="admin">Admin</option><option value="healthworker">Health Worker</option></select>
    <button class="btn primary full">Login</button>
    <p id="loginMsg" class="message"></p>
  </form>
  <div class="login-demo"><b>Demo accounts</b><br>Admin: <code>admin</code> / <code>admin123</code><br>Health Worker: register below</div>
  <button class="btn outline full" onclick="openRegister()">Register as Health Worker</button>
</div>
<div id="registerModal" class="modal hidden">
 <div class="modal-box"><button class="close" onclick="closeRegister()">×</button><h2>Health Worker Registration</h2>
 <form id="registerForm"><label>Full Name</label><input id="regName" required>
 <label>Username</label><input id="regUser" required><label>Password</label><input id="regPass" type="password" required minlength="6">
 <button class="btn primary full">Submit Registration</button></form>
 <p class="muted">Your account must be approved by an administrator before you can log in.</p></div>
</div>
<script src="js/app.js"></script>
</body></html>
